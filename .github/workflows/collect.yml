name: Recoger tiempos de espera DLP

on:
  schedule:
    # Cada 15 min entre las 06:30 y las 22:45 UTC (cubre 08:30-00:45 en Paris,
    # verano e invierno). GitHub puede retrasar el disparo unos minutos; la fila
    # guarda la hora real de la muestra, no la programada.
    - cron: "*/15 6-22 * * *"
  workflow_dispatch:

concurrency:
  group: dlp-collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recoger muestra
        run: python collect.py

      - name: Guardar en el repo
        run: |
          git config user.name  "dlp-bot"
          git config user.email "dlp-bot@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -m "datos: $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 5
          done
          exit 1
